title: Mathematical Tours
name: Mathematical Tours of Data Sciences
author: Gabriel Peyré
email: gabriel.peyre@ens.fr
description: "Open books and teaching resources on the mathematics of data sciences, by Gabriel Peyré."
url: "https://mathematical-tours.github.io"
baseurl: ""
github_username: mathematical-tours
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-feed

# Downloads stay public. Development files and archived sources live on GitHub.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - node_modules
  - vendor
  - tools
  - docs
  - less
  - js-old
  - tweets-sources
  - tweets-list
  - book-sources/myst
  - book-sources/build
  - book-sources/legacy
  - book-sources/arxiv
  - book-sources/data
  - book-sources/figures
  - book-sources/figures-code
  - book-sources/tools
  - book-sources/draft
  - book-sources/docs
  - book-sources/chapters-tex
  - book-basics-sources/.venv
  - book-basics-sources/legacy
  - book-basics-sources/build
  - book-basics-sources/chapters-tex
  - book-basics-sources/figures
  - book-basics-sources/figures-code
  - book-basics-sources/tools
  - book-basics-sources/website
  - daft-sources/.venv
  - daft-sources/legacy
  - daft-sources/build
  - daft-sources/chapters-tex
  - daft-sources/figures
  - daft-sources/figures-code
  - daft-sources/listings
  - daft-sources/tools

# These directories are required by the existing MyST interactive edition.
include:
  - _assets
  - _shared
  - _index*
