<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · Mathematical Tours</title>
  <meta name="description" content="{{ page.description | escape }}">
  <meta name="author" content="Gabriel Peyré">
  <link rel="canonical" href="https://mathematical-tours.github.io{{ page.url }}">
  <meta property="og:type" content="book">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:url" content="https://mathematical-tours.github.io{{ page.url }}">
  <meta property="og:image" content="https://mathematical-tours.github.io{{ '/img/foundations-cover.webp' | relative_url }}">
  <meta property="og:image:alt" content="Cover of Mathematical Foundations of Data Sciences by Gabriel Peyré">
  <link rel="stylesheet" href="{{ '/css/book.css' | relative_url }}">
  <script src="{{ '/js/book.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the book</a>
  <header class="site-header">
    <nav class="site-nav wrap" aria-label="Main navigation">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">M<span>∕</span>T</span>Mathematical Tours</a>
      <div class="nav-links"><a href="#chapters">Chapters</a><a href="#resources">Resources</a><a href="{{ '/book/interactive/' | relative_url }}">Interactive book <span aria-hidden="true">↗</span></a></div>
    </nav>
  </header>
  {{ content }}
  <footer class="site-footer wrap">
    <p>Gabriel Peyré <span aria-hidden="true">·</span> CNRS &amp; DMA, École Normale Supérieure</p>
    <a href="https://github.com/mathematical-tours/mathematical-tours.github.io/tree/master/book-sources">LaTeX and figure sources <span aria-hidden="true">↗</span></a>
  </footer>
</body>
</html>
