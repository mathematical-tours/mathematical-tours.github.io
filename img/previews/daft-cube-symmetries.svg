<svg xmlns="http://www.w3.org/2000/svg" width="440" height="240" viewBox="0 0 440 240" role="img" aria-labelledby="title description">
<title id="title">Cube rotations and four body diagonals</title>
<desc id="description">The four colored segments join opposite vertices. The 24 orientation-preserving symmetries of the cube permute these four diagonal lines, realizing the symmetric group S4.</desc>
<rect width="440" height="240" fill="white"/>
<g stroke="#c0ced0" stroke-width="1.6" fill="none">
<path d="M 102,125 L 102,23"/>
<path d="M 102,125 L 22,177"/>
<path d="M 102,125 L 218,157"/>
<path d="M 102,23 L 22,75"/>
<path d="M 102,23 L 218,55"/>
<path d="M 22,177 L 22,75"/>
<path d="M 22,177 L 138,209"/>
<path d="M 22,75 L 138,107"/>
<path d="M 218,157 L 218,55"/>
<path d="M 218,157 L 138,209"/>
<path d="M 218,55 L 138,107"/>
<path d="M 138,209 L 138,107"/>
</g><g stroke-width="3" stroke-linecap="round">
<path d="M 102,23 L 138,209" stroke="#176d75"/>
<circle cx="102" cy="23" r="4.5" fill="#176d75" stroke="white" stroke-width="1"/>
<circle cx="138" cy="209" r="4.5" fill="#176d75" stroke="white" stroke-width="1"/>
<path d="M 22,75 L 218,157" stroke="#be7038"/>
<circle cx="22" cy="75" r="4.5" fill="#be7038" stroke="white" stroke-width="1"/>
<circle cx="218" cy="157" r="4.5" fill="#be7038" stroke="white" stroke-width="1"/>
<path d="M 218,55 L 22,177" stroke="#557cab"/>
<circle cx="218" cy="55" r="4.5" fill="#557cab" stroke="white" stroke-width="1"/>
<circle cx="22" cy="177" r="4.5" fill="#557cab" stroke="white" stroke-width="1"/>
<path d="M 138,107 L 102,125" stroke="#9e547d"/>
<circle cx="138" cy="107" r="4.5" fill="#9e547d" stroke="white" stroke-width="1"/>
<circle cx="102" cy="125" r="4.5" fill="#9e547d" stroke="white" stroke-width="1"/>
</g><g fill="#234c50" font-family="Arial, Helvetica, sans-serif">
<text x="260" y="65" font-size="21">Cube symmetries</text>
<text x="260" y="109" font-size="35" font-weight="600">24</text>
<text x="310" y="108" font-size="19">rotations</text>
<text x="260" y="146" font-size="19">4 diagonals</text>
<circle cx="269" cy="179" r="6" fill="#176d75"/>
<circle cx="301" cy="179" r="6" fill="#be7038"/>
<circle cx="333" cy="179" r="6" fill="#557cab"/>
<circle cx="365" cy="179" r="6" fill="#9e547d"/>
</g>
</svg>
