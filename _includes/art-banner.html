{% assign artwork_key = page.artwork | default: 'paysages' %}
{% assign artwork = site.data.artworks[artwork_key] %}
<figure class="artwork-banner">
  <div class="art-banner{% if page.url == '/' %} art-banner-home{% endif %}">
    <img src="{{ artwork.image | relative_url }}" alt="{{ artwork.alt | escape }}" width="{{ artwork.width }}" height="{{ artwork.height }}" fetchpriority="high">
  </div>
  <figcaption class="artwork-credit wrap"><span>Painting detail by <a href="https://www.louispeyre.com/">Louis Peyré (1923–2012)</a></span><a href="{{ '/' | relative_url }}#paintings">About the paintings <span aria-hidden="true">↗</span></a></figcaption>
</figure>
